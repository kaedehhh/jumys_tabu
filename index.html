<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жұмыс орындарын ұсыну жүйесі</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1d2433; --muted: #667085;
    --line: #e4e7ec; --accent: #3b5bdb; --accent-soft: #e7ecff;
    --good: #2f9e44; --good-soft: #e3f6e8; --bad: #c92a2a; --bad-soft: #fde8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b1f29; --text: #e8eaf0; --muted: #9aa3b5;
      --line: #2b3140; --accent: #7c93ff; --accent-soft: #232b4d;
      --good: #5fd07a; --good-soft: #1b3324; --bad: #ff8787; --bad-soft: #3b1f22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 20px;
  }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  select, input[type=number] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-size: 1rem;
  }
  .check { display: flex; align-items: center; gap: 8px; padding-top: 22px; }
  .check input { width: 18px; height: 18px; }
  .check label { margin: 0; color: var(--text); font-size: 1rem; }
  .profile { margin-top: 14px; font-size: .95rem; color: var(--muted); }
  .chip {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    font-size: .8rem; margin: 2px 4px 2px 0;
  }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .vac {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .vac-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .vac h3 { margin: 0; font-size: 1.1rem; }
  .vac .company { color: var(--muted); font-size: .9rem; }
  .salary { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
  .meta { color: var(--muted); font-size: .9rem; margin: 6px 0 10px; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .pct { font-size: .85rem; color: var(--muted); margin: 6px 0 8px; }
  .empty, .error {
    padding: 24px; text-align: center; color: var(--muted);
    background: var(--card); border: 1px dashed var(--line); border-radius: 14px;
  }
  .error { color: var(--bad); }
  details { margin-top: 20px; }
  summary { cursor: pointer; color: var(--accent); }
  pre {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; overflow-x: auto; font-size: .8rem;
  }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Жұмыс орындарын ұсыну жүйесі</h1>
  <p class="sub">Пайдаланушының дағдылары вакансия талаптарымен салыстырылып, сәйкестік пайызы есептеледі.</p>

  <div class="panel">
    <div class="grid">
      <div>
        <label for="user">Пайдаланушы</label>
        <select id="user"></select>
      </div>
      <div>
        <label for="sort">Сұрыптау</label>
        <select id="sort">
          <option value="match">Сәйкестік бойынша</option>
          <option value="salary_desc">Жоғары жалақы бірінші</option>
          <option value="salary_asc">Төмен жалақы бірінші</option>
          <option value="exp_asc">Тәжірибе талабы аз бірінші</option>
          <option value="exp_desc">Тәжірибе талабы көп бірінші</option>
          <option value="title">Атауы бойынша (А-Я)</option>
        </select>
      </div>
      <div>
        <label for="minSalary">Ең төменгі жалақы (₸)</label>
        <input type="number" id="minSalary" value="0" min="0" step="10000">
      </div>
      <div class="check">
        <input type="checkbox" id="cityOnly">
        <label for="cityOnly">Тек өз қаласында</label>
      </div>
    </div>
    <div class="profile" id="profile"></div>
  </div>

  <p class="count" id="count"></p>
  <div id="results"></div>

  <details>
    <summary>Қолданылған SQL сұранысын көрсету</summary>
    <pre id="sqlView"></pre>
  </details>
</div>

<script>
const SORTS = {
  match:       "match_percent DESC, v.salary DESC",
  salary_desc: "v.salary DESC, match_percent DESC",
  salary_asc:  "v.salary ASC, match_percent DESC",
  exp_asc:     "v.experience_years ASC, match_percent DESC",
  exp_desc:    "v.experience_years DESC, match_percent DESC",
  title:       "v.title ASC"
};

const SETUP_SQL = `
PRAGMA foreign_keys = ON;
CREATE TABLE Users (user_id INTEGER PRIMARY KEY, full_name TEXT NOT NULL, email TEXT, phone TEXT, city TEXT, experience_years INTEGER);
CREATE TABLE Companies (company_id INTEGER PRIMARY KEY, company_name TEXT NOT NULL, industry TEXT, city TEXT, email TEXT);
CREATE TABLE Vacancies (vacancy_id INTEGER PRIMARY KEY, company_id INTEGER, title TEXT NOT NULL, description TEXT, city TEXT, salary REAL, experience_years INTEGER, FOREIGN KEY (company_id) REFERENCES Companies(company_id));
CREATE TABLE Skills (skill_id INTEGER PRIMARY KEY, skill_name TEXT NOT NULL, category TEXT);
CREATE TABLE User_Skills (user_id INTEGER, skill_id INTEGER, skill_level TEXT, PRIMARY KEY (user_id, skill_id), FOREIGN KEY (user_id) REFERENCES Users(user_id), FOREIGN KEY (skill_id) REFERENCES Skills(skill_id));
CREATE TABLE Vacancy_Skills (vacancy_id INTEGER, skill_id INTEGER, required_level TEXT, PRIMARY KEY (vacancy_id, skill_id), FOREIGN KEY (vacancy_id) REFERENCES Vacancies(vacancy_id), FOREIGN KEY (skill_id) REFERENCES Skills(skill_id));
CREATE TABLE Applications (application_id INTEGER PRIMARY KEY, user_id INTEGER, vacancy_id INTEGER, application_date TEXT, status TEXT, FOREIGN KEY (user_id) REFERENCES Users(user_id), FOREIGN KEY (vacancy_id) REFERENCES Vacancies(vacancy_id));

`;

let db;
const $ = id => document.getElementById(id);

function rows(sql, params) {
  const res = db.exec(sql, params || []);
  if (!res.length) return [];
  const { columns, values } = res[0];
  return values.map(v => Object.fromEntries(v.map((x, i) => [columns[i], x])));
}

function buildQuery(sortKey) {
  return `SELECT
    v.vacancy_id, v.title, c.company_name, v.city, v.salary, v.experience_years,
    COUNT(vs.skill_id) AS required_skills,
    COUNT(us.skill_id) AS matched_skills,
    ROUND(100.0 * COUNT(us.skill_id) / COUNT(vs.skill_id), 1) AS match_percent
FROM Vacancies v
JOIN Companies c ON v.company_id = c.company_id
JOIN Vacancy_Skills vs ON v.vacancy_id = vs.vacancy_id
LEFT JOIN User_Skills us ON us.skill_id = vs.skill_id AND us.user_id = ?
WHERE v.salary >= ?
  AND (? = 0 OR v.city = (SELECT city FROM Users WHERE user_id = ?))
GROUP BY v.vacancy_id, v.title, c.company_name, v.city, v.salary, v.experience_years
HAVING matched_skills > 0
ORDER BY ${SORTS[sortKey]}`;
}

const fmt = n => Number(n).toLocaleString("ru-RU").replace(/\u00a0/g, " ") + " ₸";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function render() {
  const uid = Number($("user").value);
  const sortKey = $("sort").value;
  const minSalary = Number($("minSalary").value) || 0;
  const cityOnly = $("cityOnly").checked ? 1 : 0;

  // Пайдаланушы профилі
  const u = rows("SELECT * FROM Users WHERE user_id = ?", [uid])[0];
  const mySkills = rows(
    `SELECT s.skill_name, us.skill_level FROM User_Skills us
     JOIN Skills s ON s.skill_id = us.skill_id WHERE us.user_id = ?`, [uid]);
  const prof = $("profile");
  prof.textContent = "";
  prof.append(`${u.city} · тәжірибе: ${u.experience_years} жыл · дағдылары: `);
  if (mySkills.length) {
    mySkills.forEach(s => prof.append(el("span", "chip", `${s.skill_name} (${s.skill_level})`)));
  } else {
    prof.append("көрсетілмеген");
  }

  // Ұсыныстар
  const sql = buildQuery(sortKey);
  $("sqlView").textContent = sql;
  const list = rows(sql, [uid, minSalary, cityOnly, uid]);

  // Әр вакансияның дағдылары (сәйкес / жетіспейтін)
  const skillRows = rows(
    `SELECT vs.vacancy_id, s.skill_name, vs.required_level,
            CASE WHEN us.skill_id IS NOT NULL THEN 1 ELSE 0 END AS has_it
     FROM Vacancy_Skills vs
     JOIN Skills s ON s.skill_id = vs.skill_id
     LEFT JOIN User_Skills us ON us.skill_id = vs.skill_id AND us.user_id = ?`, [uid]);
  const byVac = {};
  skillRows.forEach(r => (byVac[r.vacancy_id] = byVac[r.vacancy_id] || []).push(r));

  const out = $("results");
  out.textContent = "";
  $("count").textContent = list.length ? `Табылған вакансиялар: ${list.length}` : "";

  if (!list.length) {
    out.append(el("div", "empty", mySkills.length
      ? "Таңдалған сүзгілер бойынша сәйкес вакансия табылмады."
      : "Бұл пайдаланушының дағдылары базада жоқ, сондықтан ұсыныс жасау мүмкін емес."));
    return;
  }

  list.forEach(v => {
    const card = el("div", "vac");
    const head = el("div", "vac-head");
    const left = el("div");
    left.append(el("h3", "", v.title), el("div", "company", v.company_name));
    head.append(left, el("div", "salary", fmt(v.salary)));

    const meta = el("div", "meta",
      `${v.city} · тәжірибе талабы: ${v.experience_years} жыл`);

    const bar = el("div", "bar");
    const fill = el("span");
    fill.style.width = v.match_percent + "%";
    bar.append(fill);
    const pct = el("div", "pct",
      `Сәйкестік: ${v.match_percent}% (${v.matched_skills} / ${v.required_skills} дағды)`);

    const chips = el("div");
    (byVac[v.vacancy_id] || []).forEach(s => {
      chips.append(el("span", "chip " + (s.has_it ? "good" : "bad"),
        `${s.has_it ? "✓" : "✗"} ${s.skill_name} (${s.required_level})`));
    });

    card.append(head, meta, bar, pct, chips);
    out.append(card);
  });
}

async function init() {
  try {
    const SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}`
    });
    db = new SQL.Database();
    db.exec(SETUP_SQL);

    rows("SELECT user_id, full_name, city FROM Users").forEach(u => {
      const o = document.createElement("option");
      o.value = u.user_id;
      o.textContent = `${u.full_name} (${u.city})`;
      $("user").append(o);
    });

    ["user", "sort", "minSalary", "cityOnly"].forEach(id =>
      $(id).addEventListener(id === "minSalary" ? "input" : "change", render));
    render();
  } catch (e) {
    $("results").append(el("div", "error",
      "Деректер базасын жүктеу мүмкін болмады: " + e.message +
      ". Интернет байланысын тексеріп, бетті жаңартыңыз."));
  }
}
init();
</script>
